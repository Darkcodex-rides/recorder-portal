services:

  loki:
    image: grafana/loki:3.5.0
    container_name: recorder-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki:/etc/loki
    networks:
      - recorder-network

  grafana:
    image: grafana/grafana:12.0.2
    container_name: recorder-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - recorder-network

  promtail:
    image: grafana/promtail:3.5.0
    container_name: recorder-promtail
    volumes:
      - ./promtail:/etc/promtail
      - ../backend/logs:/var/log/recorder
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - recorder-network

networks:
  recorder-network:
    driver: bridge